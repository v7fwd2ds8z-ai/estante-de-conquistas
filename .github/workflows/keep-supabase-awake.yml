name: Manter Supabase acordado
on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping real na tabela games
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/games?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -o /dev/null -w "Status: %{http_code}\n"
